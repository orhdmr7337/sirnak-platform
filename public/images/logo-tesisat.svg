<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f97316" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Inner Circle -->
  <circle cx="200" cy="200" r="150" fill="#0c0c0c"/>
  
  <!-- Wrench Icon -->
  <g transform="translate(200,160) rotate(-45)">
    <rect x="-8" y="-60" width="16" height="80" rx="4" fill="url(#grad2)"/>
    <circle cx="0" cy="-60" r="25" fill="none" stroke="url(#grad2)" stroke-width="8"/>
    <circle cx="0" cy="-60" r="12" fill="#0c0c0c"/>
  </g>
  
  <!-- Lightning Bolt -->
  <g transform="translate(240,140)">
    <polygon points="0,0 -15,25 -5,25 -20,50 15,20 5,20 20,0" fill="#fbbf24"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="white">ÇÖZÜM</text>
  <text x="200" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="url(#grad2)">NOKTASI</text>
  
  <!-- Subtitle -->
  <text x="200" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a3a3a3">TESİSAT &amp; ELEKTRİK</text>
</svg>
