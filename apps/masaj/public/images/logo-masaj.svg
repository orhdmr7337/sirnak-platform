<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b8f71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a96e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86b88c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4b87a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6b8f71" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Inner Circle -->
  <circle cx="200" cy="200" r="150" fill="#0a0f0a"/>
  
  <!-- Hand Icon -->
  <g transform="translate(200,150)">
    <!-- Palm -->
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="url(#grad2)"/>
    <!-- Fingers -->
    <ellipse cx="-25" cy="-30" rx="8" ry="20" fill="url(#grad2)" transform="rotate(-15 -25 -30)"/>
    <ellipse cx="-8" cy="-40" rx="8" ry="22" fill="url(#grad2)" transform="rotate(-5 -8 -40)"/>
    <ellipse cx="10" cy="-42" rx="8" ry="24" fill="url(#grad2)" transform="rotate(5 10 -42)"/>
    <ellipse cx="28" cy="-35" rx="8" ry="20" fill="url(#grad2)" transform="rotate(15 28 -35)"/>
    <!-- Thumb -->
    <ellipse cx="-40" cy="-10" rx="8" ry="18" fill="url(#grad2)" transform="rotate(-40 -40 -10)"/>
  </g>
  
  <!-- Leaf -->
  <g transform="translate(260,120)">
    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#6b8f71" transform="rotate(30 0 0)"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#0a0f0a" stroke-width="1.5"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="260" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="white">DOĞAL</text>
  <text x="200" y="290" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="url(#grad2)">DOKUNUŞ</text>
  
  <!-- Subtitle -->
  <text x="200" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8a9a8a">MASAJ &amp; WELLNESS</text>
</svg>
