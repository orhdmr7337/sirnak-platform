name: Deploy Apps to Netlify

on:
  push:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm ci --legacy-peer-deps
      - working-directory: apps/admin
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_ADMIN }}
        run: npx netlify-cli deploy --prod --build

  deploy-masaj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm ci --legacy-peer-deps
      - working-directory: apps/masaj
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_MASAJ }}
        run: npx netlify-cli deploy --prod --build

  deploy-tesisat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm ci --legacy-peer-deps
      - working-directory: apps/tesisat
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_TESISAT }}
        run: npx netlify-cli deploy --prod --build
